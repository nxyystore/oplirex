[package]
name = "oplirex"
version = "1.0.0"
edition = "2021"
description = "Proxy for OpenCode rate limits, plus a local proxy that adds free models to Claude Code."
authors = ["nxyy"]
license = "MIT"
repository = "https://github.com/nxyystore/oplirex"
homepage = "https://github.com/nxyystore/oplirex"

[[bin]]
name = "oplirex"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1", features = ["full", "process"] }
axum = { version = "0.7", features = ["json", "query"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "blocking"] }
tower = { version = "0.5", features = ["util"] }
futures = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
