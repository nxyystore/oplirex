name: Auto Tag on Release Commit

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  autotag:
    # skip only if commit explicitly has [skip ci] - guard against null head_commit (e.g. tag pushes, API)
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use PAT so tag push triggers build.yml (GITHUB_TOKEN pushes don't trigger). Fallback to GITHUB_TOKEN if GH_PAT not set.
          token: ${{ secrets.GH_PAT != '' && secrets.GH_PAT }}

      - name: Parse commit message for release/bump version
        id: parse
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $MSG"
          # Must start with release: or bump: (with optional scope) then vX.Y.Z
          if echo "$MSG" | grep -qiE '^(release|bump)(\(.+\))?:[[:space:]]*v[0-9]+\.[0-9]+\.[0-9]+'; then
            VER=$(echo "$MSG" | grep -oiE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | head -1 | tr -d 'vV')
            echo "ver=$VER" >> "$GITHUB_OUTPUT"
            echo "Found version: $VER"
          else
            echo "No release:/bump: prefix with version found — skipping"
          fi

      - name: Create tag and sync version
        if: steps.parse.outputs.ver != ''
        shell: bash
        run: |
          set -e
          VER="${{ steps.parse.outputs.ver }}"
          TAG="v$VER"
          echo "Processing $TAG"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping"
            exit 0
          fi

          # Sync all packaging metadata from commit version
          python3 scripts/sync_release_version.py "$VER"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet; then
            git add -A
            git commit -m "chore: sync version $TAG [skip ci]"
          fi

          git tag "$TAG"
          # Push commit + tag. Uses token from checkout (GH_PAT if set, otherwise GITHUB_TOKEN).
          # NOTE: GITHUB_TOKEN pushes do NOT trigger other workflows (build.yml). Create a PAT
          # with repo + workflow scopes and add as GH_PAT secret to auto-trigger releases.
          git push origin HEAD:main --follow-tags || git push origin HEAD --follow-tags

      - name: Summary
        if: steps.parse.outputs.ver == ''
        run: echo 'No release or bump commit - no tag created'
