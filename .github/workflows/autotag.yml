name: Auto Tag

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autotag:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - id: parse
        shell: bash
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "msg: $MSG"
          if echo "$MSG" | grep -qiE '^(release|bump)(\(.+\))?:[[:space:]]*v[0-9]+\.[0-9]+\.[0-9]+'; then
            VER=$(echo "$MSG" | grep -oiE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?' | head -1 | tr -d vV)
            echo "ver=$VER" >> $GITHUB_OUTPUT
          else
            echo "no version"
          fi

      - if: steps.parse.outputs.ver != ''
        shell: bash
        run: |
          set -e
          VER=${{ steps.parse.outputs.ver }}
          TAG=v$VER
          # skip only if tag already exists on remote
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "tag $TAG already on remote — skip"
            exit 0
          fi
          git fetch --tags --force origin || true
          # if local tag exists stale, delete it so we recreate annotated
          git tag -d "$TAG" 2>/dev/null || true
          python3 scripts/sync_release_version.py "$VER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync $TAG [skip ci]"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD
          git push origin "$TAG"
