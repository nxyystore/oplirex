name: Build

# CI build/test only. Release publishing on v* tags is handled by release.yml (dist).
on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: oplirex
            ext: ''
            os_name: linux
          - os: windows-latest
            target: x86_64-pc-windows-gnu
            binary: oplirex.exe
            ext: '.exe'
            os_name: windows
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: oplirex
            ext: ''
            os_name: macos
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: oplirex
            ext: ''
            os_name: macos-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
