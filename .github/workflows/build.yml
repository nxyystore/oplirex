name: Build

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version:
        description: "v1.0.0"
        required: false
        default: ""
  workflow_run:
    workflows: ["Auto Tag"]
    types: [completed]

env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, os_name: linux-x86_64, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, os_name: windows-x86_64, ext: ".exe" }
          - { os: macos-latest, target: x86_64-apple-darwin, os_name: macos-x86_64, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, os_name: macos-arm64, ext: "" }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu, os_name: linux-aarch64, ext: "" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
      - if: github.event_name == 'workflow_run'
        run: |
          git fetch --tags --force origin || git fetch --tags || true
          TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          echo "found TAG=$TAG"
          [ -n "$TAG" ] && git checkout "$TAG" || git checkout "origin/${{ github.event.workflow_run.head_branch }}" || true
          git describe --tags 2>/dev/null || git rev-parse --short HEAD
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
        shell: bash
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - shell: bash
        run: |
          mkdir -p release
          BIN=oplirex${{ matrix.ext }}
          cp target/${{ matrix.target }}/release/$BIN release/oplirex-${{ matrix.os_name }}${{ matrix.ext }}
          cd release && tar czf oplirex-${{ matrix.os_name }}.tar.gz oplirex-${{ matrix.os_name }}${{ matrix.ext }} 2>/dev/null || 7z a oplirex-${{ matrix.os_name }}.zip oplirex-${{ matrix.os_name }}${{ matrix.ext }} >/dev/null
          sha256sum * > SHA256SUMS-${{ matrix.os_name }}.txt 2>/dev/null || shasum -a 256 * > SHA256SUMS-${{ matrix.os_name }}.txt
      - if: matrix.os == 'windows-latest' && hashFiles('platforms/windows/oplire.wxs') != ''
        shell: bash
        run: |
          cargo install cargo-wix --locked || true
          cargo wix --nocapture --target ${{ matrix.target }} || true
          find target -name "*.msi" -exec cp {} release/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: oplirex-${{ matrix.os_name }}
          path: release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: oplirex-*
          merge-multiple: true
      - run: |
          cd release
          cat SHA256SUMS-*.txt 2>/dev/null > SHA256SUMS.txt || sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
        shell: bash
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.version }}
          files: release/**/*
          generate_release_notes: true
