name: Publish

on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "v1.0.0"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm:
    runs-on: ubuntu-latest
    permissions: { contents: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, registry-url: https://registry.npmjs.org }
      - run: |
          VER=${GITHUB_REF_NAME#v}; VER=${VER:-${{ github.event.inputs.version }}}; VER=${VER#v}
          [ -n "$VER" ] && npm --prefix platforms/npm version "$VER" --no-git-tag-version --allow-same-version || true
        shell: bash
      - working-directory: platforms/npm
        run: npm publish --provenance --access public

  scoop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
        run: |
          VER=${GITHUB_REF_NAME#v}; VER=${VER#v}
          gh repo view nxyystore/scoop-bucket >/dev/null 2>&1 || exit 0
          gh repo clone nxyystore/scoop-bucket /tmp/b
          HASH=$(curl -fsSL https://github.com/nxyystore/oplirex/releases/download/v$VER/SHA256SUMS.txt 2>/dev/null | grep "windows.*zip" | awk '{print $1}')
          [ -n "$HASH" ] && sed -i "s/\"hash\": \".*\"/\"hash\": \"$HASH\"/" platforms/scoop/oplirex.json
          cp platforms/scoop/oplirex.json /tmp/b/bucket/oplirex.json
          cd /tmp/b && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/oplirex.json && git diff --cached --quiet || git commit -m "oplirex v$VER" && git push
        shell: bash

  choco:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          $v="${{ github.ref_name }}".TrimStart('v'); if(-not $v){$v="${{ github.event.inputs.version }}".TrimStart('v')}
          $h=""; try{$t=Invoke-RestMethod "https://github.com/nxyystore/oplirex/releases/download/v$v/SHA256SUMS.txt" -TimeoutSec 30; $l=$t -split "`n" | ?{$_ -match "windows.*zip"} | select -First 1; if($l){$h=($l -split '\s+')[0]}}catch{}
          if($h){(Get-Content platforms/chocolatey/tools/chocolateyinstall.ps1)-replace "checksum64\s*=\s*'[^']+'","checksum64 = '$h'"|Set-Content platforms/chocolatey/tools/chocolateyinstall.ps1}
          echo "VER=$v" >> $env:GITHUB_ENV
      - run: choco pack platforms/chocolatey/oplirex.nuspec --version $env:VER; choco push "oplirex.$env:VER.nupkg" --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
        shell: pwsh

  aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VER=${GITHUB_REF_NAME#v}; VER=${VER#v}; VER=${VER:-${{ github.event.inputs.version }}}; VER=${VER#v}
          TMP=$(mktemp); curl -fsSL https://github.com/nxyystore/oplirex/releases/download/v$VER/SHA256SUMS.txt -o $TMP 2>/dev/null || true
          H1=$(grep -F "oplirex-linux-x86_64.tar.gz" $TMP 2>/dev/null | awk '{print $1}'); [ -n "$H1" ] && sed -i "s/sha256sums_x86_64=('SKIP')/sha256sums_x86_64=('$H1')/" platforms/arch/PKGBUILD-bin
          H2=$(grep -F "oplirex-linux-aarch64.tar.gz" $TMP 2>/dev/null | awk '{print $1}'); [ -n "$H2" ] && sed -i "s/sha256sums_aarch64=('SKIP')/sha256sums_aarch64=('$H2')/" platforms/arch/PKGBUILD-bin
        shell: bash
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: oplirex
          pkgbuild: platforms/arch/PKGBUILD
          commit_username: "github-actions[bot]"
          commit_email: "41898282+github-actions[bot]@users.noreply.github.com"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      - uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: oplirex-bin
          pkgbuild: platforms/arch/PKGBUILD-bin
          commit_username: "github-actions[bot]"
          commit_email: "41898282+github-actions[bot]@users.noreply.github.com"
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  brew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VER=${GITHUB_REF_NAME#v}; VER=${VER#v}; VER=${VER:-${{ github.event.inputs.version }}}; VER=${VER#v}
          TMP=$(mktemp); curl -fsSL https://github.com/nxyystore/oplirex/releases/download/v$VER/SHA256SUMS.txt -o $TMP 2>/dev/null || true
          for p in "oplirex-macos-arm64.tar.gz:REPLACEME_ARM64" "oplirex-macos-x86_64.tar.gz:REPLACEME_X86_64" "oplirex-linux-aarch64.tar.gz:REPLACEME_LINUX_ARM64" "oplirex-linux-x86_64.tar.gz:REPLACEME_LINUX_X86_64"; do IFS=: read f ph <<< "$p"; h=$(grep -F "$f" $TMP 2>/dev/null | awk '{print $1}'); [ -n "$h" ] && sed -i "s/sha256 \"$ph\"/sha256 \"$h\"/" platforms/homebrew/oplirex.rb; done
          echo "VER=$VER" >> $GITHUB_ENV
        shell: bash
      - env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          gh repo view nxyystore/homebrew-oplirex >/dev/null 2>&1 || exit 0
          gh repo clone nxyystore/homebrew-oplirex /tmp/b
          cp platforms/homebrew/oplirex.rb /tmp/b/Formula/oplirex.rb
          cd /tmp/b && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/oplirex.rb && git diff --cached --quiet || git commit -m "oplirex v$VER" && git push
        shell: bash

  winget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          VER=${GITHUB_REF_NAME#v}; VER=${VER:-${{ github.event.inputs.version }}}; VER=${VER#v}
          echo "version=$VER" >> $GITHUB_OUTPUT
        shell: bash
      - uses: vedantmgoyal2009/winget-releaser@main
        with:
          identifier: nxyy.oplirex
          version: ${{ steps.ver.outputs.version }}
          installers-regex: 'oplirex-windows.*\.(msi|exe)$'
          token: ${{ secrets.WINGET_TOKEN }}
